<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>取消报修 - 黑工业大学校园电脑维修</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1a73e8">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="校园修电脑">
  <style>
    body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
           margin: 0; padding: 24px 16px; line-height: 1.6; background: #f6f7f9; color: #222; }
    main { max-width: 480px; margin: 24px auto; background: #fff; padding: 24px;
           border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h1 { font-size: 1.3rem; margin: 0 0 16px; }
    dl { margin: 0 0 20px; }
    dt { color: #666; font-size: .85rem; margin-top: 12px; }
    dd { margin: 2px 0 0; font-size: 1.05rem; word-break: break-all; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .9rem; background: #e8f0fe; color: #1a4fb4; }
    .tag.cancelled, .tag.rejected { background: #eee; color: #555; }
    .tag.completed { background: #e6f4ea; color: #1e6b34; }
    button { width: 100%; padding: 14px; font-size: 1.05rem; border: 0; border-radius: 10px;
             background: #d93025; color: #fff; cursor: pointer; }
    button:disabled { background: #bbb; cursor: not-allowed; }
    .msg { padding: 12px 14px; border-radius: 10px; background: #f1f3f4; margin: 0 0 16px; }
    .msg.error { background: #fce8e6; color: #a50e0e; }
    .msg.ok { background: #e6f4ea; color: #1e6b34; }
    .hint { color: #777; font-size: .85rem; margin-top: 16px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>取消报修</h1>

    <p id="loading" class="msg">正在查询订单…</p>
    <p id="error" class="msg error" hidden></p>
    <p id="done" class="msg ok" hidden></p>

    <section id="info" hidden>
      <dl>
        <dt>订单编号</dt><dd id="orderNo"></dd>
        <dt>当前状态</dt><dd><span id="status" class="tag"></span></dd>
        <dt>提交时间</dt><dd id="createdAt"></dd>
      </dl>
      <p id="blocked" class="msg" hidden></p>
      <button id="confirmBtn" type="button" hidden>确认取消这个订单</button>
      <p class="hint">取消后无法恢复。如需继续维修，请重新提交报修。</p>
      <p class="hint">建议把本页面加入浏览器收藏（或截图），以后需要取消时可以直接打开。</p>
    </section>
  </main>
  <script src="/cancel.js"></script>
  <script src="/pwa.js"></script>
</body>
</html>
