<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>管理后台 - 黑工业大学校园电脑维修</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
           margin: 0; line-height: 1.6; background: #f6f7f9; color: #222; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 12px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 18px; }
    h1 { font-size: 1.25rem; margin: 0 0 14px; }
    h2 { font-size: 1.05rem; margin: 20px 0 8px; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; font-size: .95rem; }
    input[type=text], input[type=email], input[type=password], input[type=search] {
      width: 100%; padding: 11px; font-size: 16px; border: 1px solid #c8ccd0; border-radius: 10px; font-family: inherit; }
    input:focus { outline: 2px solid #1a73e8; border-color: #1a73e8; }
    button { font-family: inherit; font-size: 1rem; padding: 10px 16px; border-radius: 10px; border: 1px solid #1a73e8;
             background: #fff; color: #1a73e8; cursor: pointer; }
    button.primary { background: #1a73e8; color: #fff; width: 100%; padding: 13px; margin-top: 16px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .banner { padding: 10px 14px; border-radius: 10px; margin: 12px 0 0; background: #fce8e6; color: #a50e0e; font-size: .92rem; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .topbar .title { font-weight: 700; }
    .who { color: #666; font-size: .85rem; margin-right: 8px; word-break: break-all; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
    .toolbar input { flex: 1; min-width: 0; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { padding: 6px 12px; border-radius: 999px; font-size: .9rem; border: 1px solid #c8ccd0; color: #333; background: #fff; }
    .chip.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    ul.orders { list-style: none; margin: 0; padding: 0; }
    ul.orders li { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.07); margin-bottom: 10px; }
    ul.orders a.row { display: block; padding: 12px 14px; color: inherit; text-decoration: none; }
    .r1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .no { font-weight: 700; }
    .r2 { margin-top: 2px; font-size: .95rem; }
    .r3 { color: #666; font-size: .85rem; margin-top: 2px; }
    .tag { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .85rem; white-space: nowrap; background: #e8f0fe; color: #1a4fb4; }
    .tag.pending { background: #fff4d6; color: #7a5b00; }
    .tag.accepted, .tag.repairing { background: #e8f0fe; color: #1a4fb4; }
    .tag.completed { background: #e6f4ea; color: #1e6b34; }
    .tag.cancelled, .tag.rejected { background: #eee; color: #555; }
    .mode { font-size: .8rem; padding: 0 8px; border-radius: 6px; background: #f1f3f4; color: #444; }
    .pager { display: flex; align-items: center; justify-content: space-between; margin: 14px 0; color: #666; font-size: .9rem; }
    .empty { text-align: center; color: #888; padding: 32px 0; }
    dl.kv { display: grid; grid-template-columns: 7.5em 1fr; gap: 8px 10px; margin: 0; }
    dl.kv dt { color: #666; font-size: .9rem; }
    dl.kv dd { margin: 0; word-break: break-word; white-space: pre-wrap; }
    dl.kv a { color: #1a73e8; }
    .images { display: flex; flex-wrap: wrap; gap: 10px; }
    .images img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; background: #eee; display: block; }
    ul.events { list-style: none; margin: 0; padding: 0; font-size: .92rem; }
    ul.events li { padding: 6px 0; border-bottom: 1px solid #eee; }
    .muted { color: #888; }
    a.back { display: inline-block; margin-bottom: 12px; color: #1a73e8; text-decoration: none; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 4px; }
    .actions button { flex: 1 1 130px; padding: 12px; }
    button.go { background: #1a73e8; color: #fff; }
    button.warn { border-color: #c5221f; color: #c5221f; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    textarea { width: 100%; padding: 11px; font-size: 16px; border: 1px solid #c8ccd0; border-radius: 10px; font-family: inherit; min-height: 84px; }
    input[type=number] { width: 100%; padding: 11px; font-size: 16px; border: 1px solid #c8ccd0; border-radius: 10px; font-family: inherit; }
    .ok { padding: 10px 14px; border-radius: 10px; margin: 0 0 12px; background: #e6f4ea; color: #1e6b34; font-size: .92rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 登录 -->
    <section id="loginView" class="card" style="max-width:420px;margin:40px auto;" hidden>
      <h1>管理员登录</h1>
      <form id="loginForm" autocomplete="on">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="loginError" class="banner" role="alert" hidden></p>
        <button id="loginBtn" class="primary" type="submit">登录</button>
      </form>
    </section>

    <!-- 后台主界面 -->
    <section id="app" hidden>
      <div class="topbar">
        <span class="title">订单管理</span>
        <span><span class="who" id="who"></span><button id="logoutBtn" type="button">退出</button></span>
      </div>

      <div id="listView">
        <form id="searchForm" class="toolbar">
          <input id="q" type="search" maxlength="30" placeholder="搜索 订单号 / 姓名 / 手机号 / 楼栋 / 房间" aria-label="搜索">
          <button type="submit">搜索</button>
        </form>
        <div id="chips" class="chips"></div>
        <p id="listError" class="banner" role="alert" hidden></p>
        <ul id="orders" class="orders"></ul>
        <p id="empty" class="empty" hidden>没有符合条件的订单</p>
        <div id="pager" class="pager" hidden>
          <button id="prevBtn" type="button">上一页</button>
          <span id="pageInfo"></span>
          <button id="nextBtn" type="button">下一页</button>
        </div>
      </div>

      <div id="detailView" hidden>
        <a class="back" href="#" id="backLink">← 返回订单列表</a>
        <p id="detailError" class="banner" role="alert" hidden></p>
        <p id="actionMsg" class="ok" role="status" hidden></p>
        <div id="detailBody" class="card"></div>
      </div>
    </section>
  </div>
  <script src="/admin/admin.js"></script>
</body>
</html>
